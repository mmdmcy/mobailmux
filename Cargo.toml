[package]
name = "mobailmux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Private web and tmux control surface for local AI agent lanes."

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
hex = "0.4"
pulldown-cmark = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
