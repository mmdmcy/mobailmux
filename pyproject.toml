[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobailmux"
version = "0.1.0"
description = "Mattermost channels as mobile control slots for CLI AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "requests>=2.31",
]

[project.scripts]
mobailmux = "mobailmux.app:main"

[tool.setuptools.packages.find]
where = ["src"]
